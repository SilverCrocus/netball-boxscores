name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_glasgow_preview:
        description: Run the DRAFT-only Glasgow import rehearsal after verification
        required: false
        default: false
        type: boolean
      expected_preview_project_ref:
        description: Supabase preview project ref required by the target guard
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/centrepass?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/centrepass?schema=public
      ANALYTICS_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/centrepass?schema=analytics
      STATS_OPERATIONS_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/centrepass?schema=public
      STATS_RATE_LIMIT_SECRET: ci-only-rate-limit-secret
      ANALYTICS_FEATURES_ENABLED: "false"
      ASK_CENTREPASS_ENABLED: "false"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run lint, typecheck, and tests
        run: npm run check
        env:
          ANALYTICS_FEATURES_ENABLED: "true"
          ASK_CENTREPASS_ENABLED: "true"

      - name: Build production application
        run: npm run build

  glasgow-preview-rehearsal:
    name: Glasgow DRAFT preview rehearsal
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.run_glasgow_preview
      && github.ref_name != github.event.repository.default_branch
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      migration-rehearsal-postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_URL }}
      DATABASE_ENVIRONMENT: staging
      WORKER_ENABLED: "false"
      ALLOW_SHARED_PRODUCTION_DB_WRITES: "false"
      EXPECTED_PREVIEW_PROJECT_REF: ${{ inputs.expected_preview_project_ref }}
      PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preview-only database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$EXPECTED_PREVIEW_PROJECT_REF"
          test -n "$PRODUCTION_PROJECT_REF"
          [[ "$EXPECTED_PREVIEW_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$PRODUCTION_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          test "$EXPECTED_PREVIEW_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          case "$DATABASE_URL" in
            *"$EXPECTED_PREVIEW_PROJECT_REF"*) ;;
            *) echo "Database URL does not match the requested preview ref" >&2; exit 72 ;;
          esac
          case "$DATABASE_URL" in
            *"$PRODUCTION_PROJECT_REF"*) echo "Production database target rejected" >&2; exit 73 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture refs-only preview target evidence
        run: npx tsx scripts/verify-preview-database-target.ts

      - name: Prove empty PostgreSQL 17 target and seed minimal Supabase roles
        env: &fresh-migration-env
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres@127.0.0.1:5432/postgres
          FRESH_MIGRATION_REHEARSAL: "true"
        run: npx tsx scripts/verify-fresh-prisma-migration-target.ts

      - name: Verify immutable historical Prisma baseline
        env: *fresh-migration-env
        run: npx tsx scripts/verify-prisma-baseline-artifact.ts

      - name: Initialize fresh PostgreSQL 17 from historical baseline
        env: *fresh-migration-env
        run: >-
          npx prisma db execute
          --file prisma/baselines/pre-20260602/baseline.sql
          --schema prisma/baselines/pre-20260602/schema.prisma

      - name: Verify initialized historical baseline parity
        env: *fresh-migration-env
        run: >-
          npx prisma migrate diff
          --from-schema-datamodel prisma/baselines/pre-20260602/schema.prisma
          --to-schema-datasource prisma/baselines/pre-20260602/schema.prisma
          --exit-code

      - name: Rehearse complete migration chain on fresh PostgreSQL 17
        env: *fresh-migration-env
        run: npx prisma migrate deploy

      - name: Verify complete fresh PostgreSQL 17 migration ledger
        env: *fresh-migration-env
        run: npx tsx scripts/verify-preview-migrations.ts

      - name: Verify and resolve Supabase remote-schema Prisma prefix
        run: npx tsx scripts/verify-preview-prisma-baseline.ts --resolve

      - name: Deploy checked-in Prisma migrations
        run: npx prisma migrate deploy

      - name: Verify exact checked-in migration ledger
        run: npx tsx scripts/verify-preview-migrations.ts

      - name: Validate the immutable bundle offline
        run: npm run db:import:glasgow -- data/glasgow-2026/v1/bundle.json --offline-preview

      - name: Normalize preview publication state to DRAFT
        run: npm run db:reset:glasgow-preview

      - name: Prepare unpublished foundation
        run: npm run db:prepare:glasgow

      - name: Build database-aware import plan
        run: npm run db:import:glasgow -- data/glasgow-2026/v1/bundle.json

      - name: Record clean preview receipt
        run: npm run db:import:glasgow -- data/glasgow-2026/v1/bundle.json --record-preview

      - name: Prove controlled import failure rolls back canonical writes
        run: npx tsx scripts/rehearse-glasgow-2026-rollback.ts

      - name: Apply exact bundle to preview
        run: npm run db:import:glasgow -- data/glasgow-2026/v1/bundle.json --apply

      - name: Prove exact replay is idempotent
        run: npm run db:import:glasgow -- data/glasgow-2026/v1/bundle.json --apply

      - name: Reconcile exact DRAFT preview state
        run: npm run db:verify:glasgow-preview

      - name: Exercise publication readiness without publishing
        run: npm run db:publish:edition -- commonwealth-games-netball glasgow-2026 --dry-run
