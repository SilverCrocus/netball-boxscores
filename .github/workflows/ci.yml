name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/centrepass?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/centrepass?schema=public
      ANALYTICS_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/centrepass?schema=analytics
      STATS_OPERATIONS_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/centrepass?schema=public
      STATS_RATE_LIMIT_SECRET: ci-only-rate-limit-secret
      ANALYTICS_FEATURES_ENABLED: "false"
      ASK_CENTREPASS_ENABLED: "false"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run lint, typecheck, and tests
        run: npm run check

      - name: Build production application
        run: npm run build
