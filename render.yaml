services:
  - type: web
    runtime: node
    name: centrepass
    # centrepass.onrender.com currently resolves through Render's us-west1
    # origin. Render regions are immutable, so keep the Blueprint aligned with
    # the existing Oregon service rather than attempting a replacement.
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: WORKER_ENABLED
        value: "true"
      - key: GLASGOW_LIVE_FEED_ENABLED
        value: "true"
        previewValue: "false"
      - key: GLASGOW_LIVE_FEED_BASE_URL
        value: https://api.commonwealthsport.com/cwg-schedule/v1/cwg
      - key: DATABASE_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ANALYTICS_FEATURES_ENABLED
        value: "false"
      - key: ASK_CENTREPASS_ENABLED
        value: "false"
      - key: ANALYTICS_DATABASE_URL
        sync: false
      - key: STATS_OPERATIONS_DATABASE_URL
        sync: false
      - key: STATS_RATE_LIMIT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
