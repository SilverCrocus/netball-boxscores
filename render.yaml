services:
  - type: web
    runtime: node
    name: centrepass
    region: sydney
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: WORKER_ENABLED
        value: "true"
      - key: DATABASE_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ANALYTICS_FEATURES_ENABLED
        value: "false"
      - key: ASK_CENTREPASS_ENABLED
        value: "false"
      - key: ANALYTICS_DATABASE_URL
        sync: false
      - key: STATS_OPERATIONS_DATABASE_URL
        sync: false
      - key: STATS_RATE_LIMIT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
